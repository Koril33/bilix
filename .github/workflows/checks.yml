name: Checks
on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Install full FFmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install encoder FFmpeg (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install ffmpeg --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'FFmpeg installation failed' }
      - name: Verify synthetic-media tools (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          ffmpeg -hide_banner -encoders > "$RUNNER_TEMP/encoders.txt"
          grep -q libx264 "$RUNNER_TEMP/encoders.txt"
          grep -q libx265 "$RUNNER_TEMP/encoders.txt"
          ffprobe -version
          echo "BILIX_TEST_FFMPEG=$(command -v ffmpeg)" >> "$GITHUB_ENV"
      - name: Verify synthetic-media tools (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $encoderPath = (Get-Command ffmpeg).Source
          $probePath = Join-Path (Split-Path $encoderPath) 'ffprobe.exe'
          $encoders = & $encoderPath -hide_banner -encoders | Out-String
          if ($LASTEXITCODE -ne 0 -or $encoders -notmatch 'libx264' -or $encoders -notmatch 'libx265') {
            throw 'Synthetic-media tests require libx264 and libx265'
          }
          & $probePath -version
          if ($LASTEXITCODE -ne 0) { throw 'Synthetic-media tests require ffprobe' }
          "BILIX_TEST_FFMPEG=$encoderPath" >> $env:GITHUB_ENV
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest -q
      - run: uv build
      - name: Wheel tool smoke test
        shell: bash
        run: uvx --from "$(find dist -name '*.whl' -print -quit)" blx --version

  windows-executable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.11'
      - run: uv sync --locked --group build
      - run: uv run --group build python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: bilix-windows
          path: |
            build/windows/bilix.exe
            build/windows/build.log
            build/windows/compilation-report.xml
            build/windows/独立 发布/smoke.json
