[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "djhx-bilix"
dynamic = ["version"]
description = "Bilibili CLI downloader with QR login, quality selection and verified downloads."
readme = "README.md"
requires-python = ">=3.11"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "curl-cffi>=0.13,<0.17",
    "platformdirs>=4.3,<5",
    "pypng>=0.20220715.0",
    "qrcode>=8.2",
    "typer>=0.20,<0.28",
    "rich>=14,<16",
]

[project.urls]
Homepage = "https://djhx.site/project/bilix.html"
Repository = "https://github.com/Koril33/bilix"
Issues = "https://github.com/Koril33/bilix/issues"

[project.scripts]
blx = "djhx_bilix.cli:main"
bilix = "djhx_bilix.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.14,<0.16"]
build = ["nuitka==4.2.2", "zstandard>=0.23,<1", "ordered-set>=4.1,<5"]

[tool.hatch.version]
path = "src/djhx_bilix/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/djhx_bilix"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/scripts", "/docs", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
