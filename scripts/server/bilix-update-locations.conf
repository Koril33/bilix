# Include INSIDE the existing bilix.djhx.site HTTPS server block, before location /.
# Release/metadata/APT misses must return 404, never the website's index.html.
location ^~ /updates/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
location ^~ /releases/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
location ^~ /apt/ {
    try_files $uri =404;
    add_header Cache-Control "no-cache" always;
}
